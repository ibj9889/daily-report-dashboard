<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>팀장 일일보고</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f48c6'/%3E%3Crect x='7' y='17' width='4' height='8' rx='1' fill='white'/%3E%3Crect x='14' y='11' width='4' height='14' rx='1' fill='white'/%3E%3Crect x='21' y='7' width='4' height='18' rx='1' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="style.css?v=mw3p7jbx">
</head>
<body>
  <section id="gate" class="gate">
    <form id="gate-form" class="gate-box" autocomplete="off">
      <h1>팀장 일일보고 대시보드</h1>
      <p>사내 열람용 페이지입니다. 공유받은 비밀번호를 입력하세요.</p>
      <input id="gate-pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
      <label><input id="gate-remember" type="checkbox" checked> 이 기기에서 기억하기</label>
      <button id="gate-btn" class="btn primary block" type="submit">열기</button>
      <div id="gate-error" class="gate-error" role="alert"></div>
    </form>
  </section>

  <div id="app" class="hidden">
    <div class="shell">
      <aside class="rail" id="rail">
        <div class="rail-top">
          <div class="brand" id="brand"><b>팀장 일일보고</b><span></span></div>
          <button class="btn small rail-lock" type="button" data-logout>잠금</button>
        </div>
        <nav class="nav" id="tabs" aria-label="화면 메뉴">
          <a class="nav-item" data-view="brief" href="#brief"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 6h6M5 8.5h6M5 11h3.5"/></svg><span>회의 브리핑</span></a>
          <a class="nav-item" data-view="day" href="#day"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg><span>일자별</span></a>
          <a class="nav-item" data-view="member" href="#member"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.6"/><path d="M3 13.5c.6-2.6 2.6-4 5-4s4.4 1.4 5 4"/></svg><span>인원별</span></a>
          <a class="nav-item" data-view="summary" href="#summary"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13V8M6.5 13V4M10 13V7M13.5 13V3"/></svg><span>일간/주간/월간 요약</span></a>
          <a class="nav-item" data-view="project" href="#project"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5l5.5-3 5.5 3-5.5 3z"/><path d="M2.5 8.5l5.5 3 5.5-3M2.5 11l5.5 3 5.5-3"/></svg><span>프로젝트</span></a>
          <a class="nav-item" data-view="status" href="#status"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4" height="4" rx="1"/><rect x="9.5" y="2.5" width="4" height="4" rx="1"/><rect x="2.5" y="9.5" width="4" height="4" rx="1"/><rect x="9.5" y="9.5" width="4" height="4" rx="1"/></svg><span>보고 현황</span></a>
          <a class="nav-item" data-view="search" href="#search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2l3.3 3.3"/></svg><span>검색</span></a>
          <a class="nav-item" data-view="guide" href="#guide"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 7.3v3.7M8 5.1v.2"/></svg><span>활용 안내</span></a>
        </nav>
        <div class="rail-head"><b id="rail-count">팀장</b><span>최근 10 보고일</span></div>
        <ul class="people" id="rail-people"></ul>
        <p class="rail-foot">막대 하나가 보고일 하루입니다. 회색은 그날 보고가 없던 날입니다.</p>
      </aside>

      <main class="main">
        <div class="crumb">
          <span id="crumb-title">회의 브리핑</span>
          <span class="upd"><span id="app-range"></span><button id="logout" class="btn small" type="button" data-logout>잠금</button></span>
        </div>
        <div id="view"></div>
      </main>
    </div>
  </div>

  <div id="tip" class="tip" role="tooltip"></div>

  <script src="data.enc.js?v=mw3p7jbx"></script>
  <script src="app.js?v=mw3p7jbx"></script>
</body>
</html>
